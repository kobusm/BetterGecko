name: BetterGecko
options:
  bundleIdPrefix: com.bettergecko
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.bettergecko.app

targets:
  BetterGecko:
    type: application
    platform: iOS
    sources:
      - path: BetterGecko
    settings:
      base:
        INFOPLIST_FILE: BetterGecko/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bettergecko.app
